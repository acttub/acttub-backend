spring:
  datasource:
    url: ${IDE_DB_URL:jdbc:mysql://localhost:3306/acttub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${IDE_DB_USERNAME:root}
    password: ${IDE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  ai:
    coaching:
      stub-enabled: ${COACHING_STUB_ANALYZER_ENABLED:false}
  storage:
    video:
      root: ${VIDEO_STORAGE_ROOT:${user.home}/Desktop/acttub-video-storage}
