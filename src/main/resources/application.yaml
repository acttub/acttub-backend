spring:
  application:
    name: acttub-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/acttub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

app:
  ai:
    coaching:
      stub-enabled: ${COACHING_STUB_ANALYZER_ENABLED:false}
  storage:
    video:
      root: ${VIDEO_STORAGE_ROOT:storage/videos}
