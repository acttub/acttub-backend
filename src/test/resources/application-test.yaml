spring:
  datasource:
    url: jdbc:h2:mem:acttub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  ai:
    coaching:
      stub-enabled: true
  storage:
    video:
      root: build/test-video-storage
