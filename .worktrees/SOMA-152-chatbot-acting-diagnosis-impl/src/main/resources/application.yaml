spring:
  application:
    name: acttub-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    coaching:
      stub-enabled: ${COACHING_STUB_ANALYZER_ENABLED:false}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        model: ${GEMINI_MODEL:gemini-3.5-flash}
        temperature: ${GEMINI_TEMPERATURE:0}
        prompt-version: ${GEMINI_PROMPT_VERSION:analysis-v0.3}
        file-processing-timeout-millis: ${GEMINI_FILE_PROCESSING_TIMEOUT_MILLIS:180000}
  storage:
    video:
      root: ${VIDEO_STORAGE_ROOT:storage/videos}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
