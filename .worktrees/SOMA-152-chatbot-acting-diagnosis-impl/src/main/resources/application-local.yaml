spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acttub_db}
    username: ${DB_USERNAME:insung}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

app:
  ai:
    coaching:
      stub-enabled: ${COACHING_STUB_ANALYZER_ENABLED:false}
  storage:
    video:
      root: ${VIDEO_STORAGE_ROOT:${user.home}/Desktop/acttub-video-storage}
