services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acttub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:?DB_NAME is required}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0}
      GEMINI_PROMPT_VERSION: ${GEMINI_PROMPT_VERSION:-analysis-v0.2}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_FILE_PROCESSING_TIMEOUT_MILLIS: ${GEMINI_FILE_PROCESSING_TIMEOUT_MILLIS:-180000}
      COACHING_STUB_ANALYZER_ENABLED: ${COACHING_STUB_ANALYZER_ENABLED:-false}
      VIDEO_STORAGE_ROOT: /app/storage/videos
    volumes:
      - video_storage:/app/storage/videos

  mysql:
    image: mysql:8.4
    container_name: acttub-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  video_storage:
